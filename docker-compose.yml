services:
  postgres:
    image: postgres:17-alpine
    container_name: produits-postgres
    environment:
      POSTGRES_DB: produits_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d produits_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: produits-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  produits-service:
    build:
      context: ./produits-service
      dockerfile: Dockerfile
    container_name: produits-service
    ports:
      - "8091:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/produits_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  avis-postgres:
    image: postgres:17-alpine
    container_name: avis-postgres
    environment:
      POSTGRES_DB: avis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - avis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  avis-service:
    build:
      context: ./avis-service
      dockerfile: Dockerfile
    container_name: avis-service
    ports:
      - "8092:8092"
    environment:
      SPRING_DATASOURCE_HOST: avis-postgres
      SPRING_DATASOURCE_PORT: 5432
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      avis-postgres:
        condition: service_healthy
      produits-service:
        condition: service_started

volumes:
  postgres_data:
  avis_postgres_data: